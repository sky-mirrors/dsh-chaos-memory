name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package-lock.json is committed; npm ci fails loudly if it drifts from
      # package.json, which is what we want for @deepseek-ai/* release-candidate deps.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test
