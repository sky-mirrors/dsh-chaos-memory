name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # package-lock.json is gitignored in this repo, so `npm ci` is not available.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test
